# Cloudflare Workers (`npx wrangler deploy`, which is what Workers Builds runs).
# The site is the static public/ folder (no build step); worker/index.js only
# handles /proxy/* (the GEPS relay). public/_headers still applies.
name = "gtg0116weather"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/proxy/*"]
